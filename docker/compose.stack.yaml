# rover_sim per-stack sim: one idle container per robot stack, each from the image
# its own repo's Dockerfile builds (scripts/build_images.sh; pins and tags in
# docker/stacks.env). Every node runs as a `docker exec` from a host tmux pane that
# scripts/sim.py builds, as the robot's *_host_tmux.sh units do.
#
#   scripts/sim.py up smoke      compose up + tmux sessions (make session S=smoke)
#   scripts/sim.py down          stop the nodes (--containers also removes these)
#   scripts/sim.py compose ...   docker compose with this file, the pin file and overrides
#
# Image tags come from docker/stacks.env, so plain compose needs it as --env-file:
#   ROVER_SIM_RUN=/tmp/rover_sim-$(id -u)/run \
#     docker compose -p rover-sim-stack --env-file docker/stacks.env -f docker/compose.stack.yaml ...
# docker/compose.local.yaml (gitignored) is appended when present, unless it sets a key
# that could undo the isolation below (sim.py refuses it then).
#
# ISOLATION is a safety requirement. This host also runs the fleet C2 zenoh router on
# *:7447, and the sim's names and root topics (/trajs, /exploration/return_home) must
# never reach the fleet. So:
#   - every container is on the network `rover-sim` only: internal (no route out, no
#     NAT), and its bridge has no IPv4 address and the containers no IPv6, so the host
#     is not reachable from it;
#   - nothing publishes a port; no host networking, no privileged, no NET_ADMIN;
#   - the sim's router runs in sim-drive and every session dials only tcp/sim-drive:7447
#     (docker/zenoh/). Multicast scouting is off everywhere.
# sim.py re-checks this on every `up` and refuses to start nodes if a sim container
# can reach anything on the host.
#
# Legacy single-container sim: docker/compose.yaml (unchanged until Phase 6).
name: rover-sim-stack

x-sim-volumes:
  - &vol-zenoh ../docker/zenoh:/rover_sim/zenoh:ro
  - &vol-scripts ../scripts:/rover_sim/scripts:ro
  - &vol-config ../config:/rover_sim/config:ro
  # Per-run files generated by sim.py (session table, later calib/teleop/spawn files).
  # No default: sim.py sets it to a dir it has checked only you can write
  # (/tmp/rover_sim-<uid>/run), as the containers run as root and execute files there.
  - &vol-run ${ROVER_SIM_RUN:?set by scripts/sim.py; plain compose needs ROVER_SIM_RUN=<a dir only you can write>}:/rover_sim/run
  # The DLIO pane scripts, as on the robot: its dlio_ws compose bind-mounts the pinned
  # checkout's scripts/ over the copy the image bakes. Here that is build_images.sh's checkout
  # of DLIO_SHA, so a pin bump follows. Never created when missing (it would be root's):
  # compose refuses to start, and sim.py says to run scripts/build_images.sh dlio-jr.
  - &vol-dlio-scripts
    type: bind
    source: ../.cache/src/dlio_ws@${DLIO_SHA:?set in docker/stacks.env; pass --env-file docker/stacks.env}/scripts
    target: /home/swarm/code/dlio_ws/scripts
    read_only: true
    bind: {create_host_path: false}

# CPU budget: each service's cpuset comes from sim.py (cpu_budget: cores 0-1 left to the
# host and the fleet C2 stack, sim-gazebo's cores for it alone, the rest shared), or from
# ROVER_SIM_CPUSET_<NAME>. Empty (plain compose, or a host under 12 cores) = unpinned.
x-sim: &sim
  init: true
  command: ["sleep", "infinity"]
  restart: "no"
  stop_grace_period: 15s
  # Tags under rover-sim/ are local builds only; never resolve one from a registry.
  pull_policy: never
  env_file: ../config/sim.env
  networks: [rover-sim]
  volumes: [*vol-zenoh, *vol-scripts, *vol-config, *vol-run]
  # Sized for a zenoh router and dozens of sessions. Docker's default (2^30 here)
  # makes some tools crawl closing every possible fd.
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  # No IPv6 in the containers. The host's docker bridges carry an fe80:: link-local
  # address even on IPv4-only networks, and the C2 router listens dual-stack on *:7447,
  # so a container with IPv6 on eth0 could still reach the host. (The router's [::]
  # listener stays valid: a dual-stack socket on :: needs no IPv6 address.)
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 1
    net.ipv6.conf.default.disable_ipv6: 1

services:
  sim-gazebo:
    <<: *sim
    image: ${GAZEBO_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-gazebo
    hostname: sim-gazebo
    cpuset: ${ROVER_SIM_CPUSET_GAZEBO:-}
    # GPU for gzclient/RViz is optional: ROVER_SIM_GAZEBO_RUNTIME=nvidia (or an override
    # in docker/compose.local.yaml). gzserver needs none: the MID-360 is a ray sensor.
    runtime: ${ROVER_SIM_GAZEBO_RUNTIME:-runc}
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"           # private IPC: no X shared memory
      NVIDIA_VISIBLE_DEVICES: ${ROVER_SIM_GAZEBO_GPUS:-all}   # read only by the nvidia runtime
      NVIDIA_DRIVER_CAPABILITIES: all
    shm_size: "1gb"
    volumes:
      - *vol-zenoh
      - *vol-scripts
      - *vol-config
      - *vol-run
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # X over the unix socket, not the network
      # rover_sim package source, for later phases to mount over the installed share.
      - ../src/rover_sim:/rover_sim/src/rover_sim:ro

  # Hosts the zenoh router (as drive.service does on a rover), then per agent
  # safety_node/teleop and the rover_description state publisher.
  sim-drive:
    <<: *sim
    image: ${DRIVE_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-drive
    hostname: sim-drive
    cpuset: ${ROVER_SIM_CPUSET_DRIVE:-}

  # One DLIO image per class: ROBOT_NAME bakes the reference robot's cfg_overlay.
  sim-dlio-jr:
    <<: *sim
    image: ${DLIO_JR_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-dlio-jr
    hostname: sim-dlio-jr
    cpuset: ${ROVER_SIM_CPUSET_DLIO_JR:-}
    volumes: [*vol-zenoh, *vol-scripts, *vol-config, *vol-run, *vol-dlio-scripts]

  sim-dlio-rr:
    <<: *sim
    image: ${DLIO_RR_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-dlio-rr
    hostname: sim-dlio-rr
    cpuset: ${ROVER_SIM_CPUSET_DLIO_RR:-}
    volumes: [*vol-zenoh, *vol-scripts, *vol-config, *vol-run, *vol-dlio-scripts]

  sim-mapping:
    <<: *sim
    image: ${MAPPING_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-mapping
    hostname: sim-mapping
    cpuset: ${ROVER_SIM_CPUSET_MAPPING:-}

  # GPU elevation mapping (the robot runs it on its Orin). Behind the `gpu` profile so a
  # host without a GPU can still run `mapping: fallback` sessions: sim.py enables the
  # profile for `mapping: gpu` sessions (plain compose: --profile gpu).
  sim-elevation:
    <<: *sim
    profiles: [gpu]
    image: ${ELEVATION_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-elevation
    hostname: sim-elevation
    cpuset: ${ROVER_SIM_CPUSET_ELEVATION:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sim-mighty:
    <<: *sim
    image: ${MIGHTY_IMAGE:?set in docker/stacks.env; pass --env-file docker/stacks.env}
    container_name: sim-mighty
    hostname: sim-mighty
    cpuset: ${ROVER_SIM_CPUSET_MIGHTY:-}

networks:
  rover-sim:
    name: rover-sim
    driver: bridge
    internal: true
    driver_opts:
      # An internal network still puts the gateway address on the bridge, and through
      # it a container can reach anything listening on the host's wildcard address,
      # such as the C2 router on *:7447. With no address on the bridge the host is not
      # on the subnet at all, while container-to-container traffic and docker's DNS work
      # as before.
      com.docker.network.bridge.inhibit_ipv4: "true"
