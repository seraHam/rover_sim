# What a MID-360 can cost per world: the most rays per 10 Hz scan (spawn_agent.launch.py
# lidar_samples; scripts/sim.py passes these) that keep 4 agents (2 jr + 2 rr) in real time.
# The robot casts 20000. A scan casts every k-th point of the 20000-point pattern frame, with
# k = ceil(20000 / lidar_samples), so ceil(20000 / k) rays: 3000 casts 2858.
#
# The livox plugin casts every ray of a scan while holding the physics lock (~0.6 us a ray in
# empty, ~2.5 us among the office's 86 walls), so physics stalls for the cast. The worlds'
# real_time_lock plugin makes the stalled time up afterwards, which holds sim time to the
# wall clock as long as casts + physics fit in real time on gzserver's busiest thread; past
# that RTF drops fast. Measured 2026-10-18 on a 20-core dev host (RTX 3090) through
# scripts/sim.py (gzserver on 3 of sim-gazebo's cores), 60 s each: gz stats RTF, the bridges'
# worst 5 s sim/rtf, the largest sim/time_offset span, points per scan after the bridge's
# no-hit cut. "rays" is what each scan cast.
#
#   empty (multi_agent_swap)      rays   RTF     worst 5 s  offset span  points
#     idle host                   1539   1.0000  0.999       2.6 ms       377
#                                 5000   1.0002  0.988       9.4 ms      1226
#                                10000   0.908   0.891      (drifts)     2451
#                                20000   0.633   0.603      (drifts)     4901
#     CPUs 12-15 busy (*)         2858   1.0002  0.972      40 ms         700
#                                 4000   1.0002  0.938      83 ms         981
#                                 5000   0.998   0.913     140 ms        1227
#   ACL_office_simple (office_explore)
#     idle host                    500   1.0000  0.999       0.9 ms       378
#                                 1539   1.0003  0.996       5.4 ms      1160
#                                 2858   0.891   0.874      (drifts)     2154
#     CPUs 12-15 busy (*)         1000   1.0000  0.982       6.5 ms       755
#                                 1539   0.999   0.912     168 ms        1160
#
# (*) 4 numpy matmul loops on 12-15, the SMT siblings of sim-gazebo's 2-5, which the other
# stacks share: the later phases' load. The budgets below are the ones that held there.
# The budget is per scan, not per world: fewer agents cost less but each scan stalls the same.
lidar_samples_4_agents:
  empty: 3000                 # 2858 rays
  ACL_office_simple: 1000     # 1000 rays
