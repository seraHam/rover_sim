# Ground-robot multi-agent exploration: 4 agents start at the corners of an 8x8
# square in the office (ACL_office_simple) and explore it with mighty's frontier
# exploration. The sim pane writes /tmp/mighty_explore.yaml: the installed
# ground-robot config with exploration and its bounds turned on.
session_name: office_explore_demo
shell_command_before: &base
- source /opt/ros/humble/setup.bash
- source /home/swarm/code/mighty_ws/install/setup.bash
- source /opt/livox_ws/install/setup.bash
- export ROS_DOMAIN_ID=20
windows:
  - window_name: sim
    layout: even-horizontal
    shell_command_before: *base
    panes:
      - shell_command:
        - sed -e 's/\(exploration\.enabled:\) false/\1 true/' -e 's/\(exploration\.bounds\.enabled:\) false/\1 true/' /home/swarm/code/mighty_ws/install/mighty/share/mighty/config/mighty_ground_robot.yaml > /tmp/mighty_explore.yaml
        - sleep 5
        - source /usr/share/gazebo/setup.bash
        - export GAZEBO_MODEL_PATH=/home/swarm/code/mighty_ws/install/mighty/share:$GAZEBO_MODEL_PATH
        - ros2 launch mighty base_mighty.launch.py use_gazebo_gui:=false use_rviz:=true env:=ACL_office_simple use_ground_robot:=true

  - window_name: core
    layout: tiled
    shell_command_before: *base
    panes:
      - shell_command:
        - sleep 12
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR01 x:=4.0 y:=4.0 z:=0.0 yaw:=-135 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/mighty_explore.yaml
      - shell_command:
        - sleep 12
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR02 x:=-4.0 y:=4.0 z:=0.0 yaw:=-45 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/mighty_explore.yaml
      - shell_command:
        - sleep 12
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR03 x:=-4.0 y:=-4.0 z:=0.0 yaw:=45 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/mighty_explore.yaml
      - shell_command:
        - sleep 12
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR04 x:=4.0 y:=-4.0 z:=0.0 yaw:=135 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/mighty_explore.yaml

  - window_name: mapping
    layout: tiled
    shell_command_before: *base
    panes:
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py use_gazebo:=true use_obstacle_tracker:=false param_file:=sim_ground_robot.yaml quad:=RR01
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py use_gazebo:=true use_obstacle_tracker:=false param_file:=sim_ground_robot.yaml quad:=RR02
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py use_gazebo:=true use_obstacle_tracker:=false param_file:=sim_ground_robot.yaml quad:=RR03
      - shell_command:
        - sleep 10
        - ros2 launch global_mapper_ros global_mapper_node.launch.py use_gazebo:=true use_obstacle_tracker:=false param_file:=sim_ground_robot.yaml quad:=RR04

  - window_name: state
    layout: tiled
    shell_command_before: *base
    panes:
      # Static identity transform map -> RRxx/map, backgrounded. Needed by older
      # mpc versions that tracked in RRxx/map; the pinned mpc tracks in map.
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR01/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR01 -r odom:=odom -r state:=state
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR02/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR02 -r odom:=odom -r state:=state
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR03/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR03 -r odom:=odom -r state:=state
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR04/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR04 -r odom:=odom -r state:=state
