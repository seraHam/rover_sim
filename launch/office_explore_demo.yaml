# Ground-robot multi-agent exploration: 4 agents start at the office's corners
# (ACL_office_simple, same spawns as office_prior_map_demo) and explore it with mighty's frontier
# exploration. The sim pane writes the configs (scripts/write_configs.sh), then
# turns on exploration and its bounds in mighty's.
session_name: office_explore_demo
shell_command_before: &base
- source /opt/ros/humble/setup.bash
- source /home/swarm/code/rover_sim_ws/install/setup.bash
- source /opt/livox_ws/install/setup.bash
- export ROS_DOMAIN_ID=20
- export ROVER_SIM_WORLD=ACL_office_simple
windows:
  - window_name: sim
    layout: even-horizontal
    shell_command_before: *base
    panes:
      - shell_command:
        - /home/swarm/rover_sim/scripts/write_configs.sh
        - sed -i -e 's/\(exploration\.enabled:\) false/\1 true/' -e 's/\(exploration\.bounds\.enabled:\) false/\1 true/' /tmp/rover_sim/mighty.yaml
        - sleep 5
        - source /usr/share/gazebo/setup.bash
        - ros2 launch mighty base_mighty.launch.py use_gazebo_gui:=false use_rviz:=false env:=$ROVER_SIM_WORLD use_ground_robot:=true pause:=true
      - shell_command:
        - sleep 5
        - ros2 run rviz2 rviz2 -d /home/swarm/rover_sim/rviz/office_explore.rviz --ros-args --log-level error

  # Every robot is spawned into the paused Gazebo before it is unpaused and
  # fake_sim, mighty and the mpc start: fake_sim's set_entity_state calls
  # racing a model insertion segfault Gazebo.
  - window_name: spawn
    layout: tiled
    shell_command_before: *base
    panes:
      - shell_command:
        - sleep 12
        - ros2 launch rover_sim spawn_robot.launch.py namespace:=RR01 model:=$ROBOT_MODEL x:=-4.5 y:=4.0 yaw:=-45
      - shell_command:
        - sleep 12
        - ros2 launch rover_sim spawn_robot.launch.py namespace:=RR02 model:=$ROBOT_MODEL x:=16.5 y:=4.0 yaw:=-135
      - shell_command:
        - sleep 12
        - ros2 launch rover_sim spawn_robot.launch.py namespace:=RR03 model:=$ROBOT_MODEL x:=16.5 y:=-17.0 yaw:=135
      - shell_command:
        - sleep 12
        - ros2 launch rover_sim spawn_robot.launch.py namespace:=RR04 model:=$ROBOT_MODEL x:=-4.8 y:=-18.5 yaw:=45

  - window_name: core
    layout: tiled
    shell_command_before: *base
    panes:
      - shell_command:
        - sleep 12
        - until pgrep -f "[r]obot_state_publisher --ros-args" | wc -l | grep -qx 4 && ! pgrep -f "[s]pawn_entity.py" >/dev/null; do sleep 1; done
        - timeout 20 ros2 service call /unpause_physics std_srvs/srv/Empty >/dev/null
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR01 x:=-4.5 y:=4.0 z:=0.0 yaw:=-45 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/rover_sim/mighty.yaml only_nodes:=fake_sim,mighty_node,mpc
      - shell_command:
        - sleep 12
        - until pgrep -f "[r]obot_state_publisher --ros-args" | wc -l | grep -qx 4 && ! pgrep -f "[s]pawn_entity.py" >/dev/null; do sleep 1; done
        - timeout 20 ros2 service call /unpause_physics std_srvs/srv/Empty >/dev/null
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR02 x:=16.5 y:=4.0 z:=0.0 yaw:=-135 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/rover_sim/mighty.yaml only_nodes:=fake_sim,mighty_node,mpc
      - shell_command:
        - sleep 12
        - until pgrep -f "[r]obot_state_publisher --ros-args" | wc -l | grep -qx 4 && ! pgrep -f "[s]pawn_entity.py" >/dev/null; do sleep 1; done
        - timeout 20 ros2 service call /unpause_physics std_srvs/srv/Empty >/dev/null
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR03 x:=16.5 y:=-17.0 z:=0.0 yaw:=135 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/rover_sim/mighty.yaml only_nodes:=fake_sim,mighty_node,mpc
      - shell_command:
        - sleep 12
        - until pgrep -f "[r]obot_state_publisher --ros-args" | wc -l | grep -qx 4 && ! pgrep -f "[s]pawn_entity.py" >/dev/null; do sleep 1; done
        - timeout 20 ros2 service call /unpause_physics std_srvs/srv/Empty >/dev/null
        - ros2 launch mighty onboard_mighty.launch.py namespace:=RR04 x:=-4.8 y:=-18.5 z:=0.0 yaw:=45 sim_env:=gazebo use_ground_robot:=true num_agents:=4 config_file:=/tmp/rover_sim/mighty.yaml only_nodes:=fake_sim,mighty_node,mpc

  - window_name: mapping
    layout: tiled
    shell_command_before: *base
    panes:
      - shell_command:
        - sleep 10
        - /home/swarm/rover_sim/scripts/run_mapper.sh RR01
      - shell_command:
        - sleep 10
        - /home/swarm/rover_sim/scripts/run_mapper.sh RR02
      - shell_command:
        - sleep 10
        - /home/swarm/rover_sim/scripts/run_mapper.sh RR03
      - shell_command:
        - sleep 10
        - /home/swarm/rover_sim/scripts/run_mapper.sh RR04

  - window_name: state
    layout: tiled
    shell_command_before: *base
    panes:
      # Static identity transform map -> RRxx/map, backgrounded. Needed by older
      # mpc versions that tracked in RRxx/map; the pinned mpc tracks in map.
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR01/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR01 -r odom:=odom -r state:=state
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR02/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR02 -r odom:=odom -r state:=state
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR03/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR03 -r odom:=odom -r state:=state
      - shell_command:
        - sleep 10
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 1 map RR04/map &
        - ros2 run mighty convert_odom_to_state --ros-args -r __ns:=/RR04 -r odom:=odom -r state:=state
