# Position swap: two P3-DX (JR) and two P3-AT (RR) on a circle of 8 m diameter in the
# empty world, each facing the centre, each sent to the start of the agent opposite it.
# All four paths cross at the centre and the opposite pairs are cross-class, so this
# exercises mighty's multi-agent avoidance over /trajs with ground-truth frame_align.
#
#   scripts/sim.py up multi_agent_swap
#
# Poses are [x m, y m, yaw deg] in the world frame; goals [x, y] likewise.
name: multi_agent_swap
world: empty
gui: false
mapping: gpu
rviz: false
agents:
  - {name: JR81, class: jr, pose: [2.83, 2.83, -135.0], goals: [[-2.83, -2.83]]}
  - {name: JR82, class: jr, pose: [-2.83, 2.83, -45.0], goals: [[2.83, -2.83]]}
  - {name: RR83, class: rr, pose: [-2.83, -2.83, 45.0], goals: [[2.83, 2.83]]}
  - {name: RR84, class: rr, pose: [2.83, -2.83, 135.0], goals: [[-2.83, 2.83]]}
