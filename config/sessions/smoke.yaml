# Smoke session: the smallest two-class sim. One P3-DX (JR, calibrated from JR02) and
# one P3-AT (RR, from RR08) face each other 4 m apart in the arena (the empty world walled
# in: DLIO drifts on a bare floor), with the no-GPU fallback mapping and no RViz. Phases 2-3
# bring up the router, Gazebo (spawns, sensor bridges, world-><ns>/map), each agent's DLIO,
# teleop + safety_node (DISARMED until scripts/sim.py arm) and rover_description, and
# frame_align; later phases add mapping and the planner.
#
#   scripts/sim.py up smoke        (make session S=smoke)
#
# Agent ids (the two digits) must be unique across classes; see scripts/sim.py.
name: smoke
world: arena
gui: false
mapping: fallback
rviz: false
agents:
  - {name: JR81, class: jr, pose: [-2.0, 0.0, 0.0]}
  - {name: RR83, class: rr, pose: [2.0, 0.0, 180.0]}
