# mapping: fallback (no GPU, "not parity"), RR class: the keys global_mapper needs on top of
# the robot's file to make the planner's grids by itself.
#
# Appended to the pinned robot file, mapping_ws@c1233f7:config/mapping/global_mapper_red_rover.yaml
# (at /mapping_config), to make the one param_file the robot's global_mapper pane passes; every
# other key, and the pane command, stay the robot's. This block comes later in the file than the
# robot's /** block, so rcl applies it last.
#
# On the robot this voxel map only feeds map_fusion, which makes the planner's grids, and the
# robot file's z_ground keeps the floor in the 2D grid. With no elevation map and no map_fusion,
# voxel/occ_2d_topic and voxel/esdf_2d_topic become the planner's grids (scripts/grid_relay.py),
# so they must hold obstacles only:
#   z_ground      odom height of the floor band's top. DLIO's <ns>/odom has the floor at z 0
#                 (base_link seeded at the lidar height, z_follow_reference), and voxels count
#                 from their lower corner, so 0.15 keeps the floor voxels (0-0.1 m) out and counts
#                 from 0.2 m up.
#   agent_height  top of the projected band: the RR's height plus a margin, as map_fusion's
#                 body band (mapping_ws@c1233f7:config/mapping/map_fusion_red_rover.yaml).
#   esdf_enabled  mighty_node plans with the ESDF cost (use_esdf_cost in
#                 tools/reference/jr02/config/mighty/hw_mighty_ground_robot.yaml), which map_fusion
#                 makes on the robot; truncation_distance stays the robot file's.
/**/global_mapper_ros:
  ros__parameters:
    z_ground: 0.15
    distance_grid_2d:
      agent_height: 0.90
      esdf_enabled: true
