# Normalised JR02 graph edges, generated 2026-10-18 from the survey's graph captures:
#   nodes:  ros2 node info of the 4 hw-mighty nodes (node_info.txt): their COMPLETE pub/sub sets.
#   topics: ros2 topic info -v of 38 planner and chain topics, keeping only endpoints of the
#           JR02 stack (namespace /JR02, plus its root-level fixed-name nodes) and dropping
#           other robots, C2 and base-station RViz. Types from the topic list / node_info.txt.
#           (Those topic captures and the fleet-wide topic list are not kept: see README.md.) JR02's lidar link was down, so lidar-derived
#           topics show their subscribers but no live publisher (e.g. livox/lidar 0 pubs).
# parity_check.py substitutes JR02 -> <ns> before comparing.
namespace: JR02
nodes:
  /JR02/convert_odom_to_state:
    publishers:
      /JR02/state: dynus_interfaces/msg/State
      /parameter_events: rcl_interfaces/msg/ParameterEvent
      /rosout: rcl_interfaces/msg/Log
    subscribers:
      /JR02/dlio/odom_node/odom: nav_msgs/msg/Odometry
      /parameter_events: rcl_interfaces/msg/ParameterEvent
  /JR02/goal_selector:
    publishers:
      /JR02/exploration/current_goal: geometry_msgs/msg/PoseStamped
      /JR02/exploration/frontiers: visualization_msgs/msg/MarkerArray
      /JR02/exploration/visited_map: nav_msgs/msg/OccupancyGrid
      /JR02/point_selector_goal: geometry_msgs/msg/PointStamped
      /JR02/selector_map_2d: nav_msgs/msg/OccupancyGrid
      /JR02/term_goal: geometry_msgs/msg/PoseStamped
      /parameter_events: rcl_interfaces/msg/ParameterEvent
      /rosout: rcl_interfaces/msg/Log
    subscribers:
      /JR02/geofence/goal_fence: std_msgs/msg/String
      /JR02/occ_2d_topic: nav_msgs/msg/OccupancyGrid
      /JR02/persistent_map/grid: nav_msgs/msg/OccupancyGrid
      /JR02/planner_status: goal_selector_msgs/msg/PlannerStatus
      /JR02/safety_node/geofence_gate: std_msgs/msg/String
      /JR02/state: dynus_interfaces/msg/State
      /JR02/term_goal_rviz: geometry_msgs/msg/PoseStamped
