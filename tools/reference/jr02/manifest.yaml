    yaml_sha256: cf7ddb7d3e362802f48f105f760e173c71051002f1c820cf3f03c10c4ac0bd73
  config/mapping/persistent_map.yaml:  # mapping:/mapping_config/ on JR02
    url: git@gitlab.com:mit-acl/ugv/redrover/mapping_ws.git
    sha: c1233f78eae7dab33ab881efab7bd7d59b679fdf
