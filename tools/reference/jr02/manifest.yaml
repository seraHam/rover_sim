# What scripts/parity_check.py compares, node by node, for the JR02 reference.
#
# fqn        the node's name on JR02. The sim name is fqn with JR02 replaced by the agent
#            namespace, or the rename in allowed_deviations.yaml.
# container  the sim container running it ({class} = jr | rr).
# params     kind dump:  a `ros2 param dump` of the robot node, its whole declared set, so keys
#                        the sim adds are drift too.
#            kind files: the param files and launch params the robot node was started with, in
#                        --params-file order. Only keys those files set are compared: there is no
#                        dump, so defaults are unknown.
#            ref_fqn:    the node name to select file blocks for (default fqn).
#            urdf_key:   compare this param's URDF joint by joint against tf/tf_tree.yaml.
#            by_class:   overrides for a class. RR files are pinned-repo files, not captured
#                        (no RR robot was surveyed); see README.md.
#            A file listed under `external` below is fetched, not stored here.
# No params entry: the robot node sets none, or they were not captured (note says which).
reference: JR02
captured: 2026-10-18
classes: {JR: jr, RR: rr}
# Robot names that parity_check replaces with the agent namespace. RR reuses JR02's launch
# params (same commands, per mapping_ws tmux/mapping_host_tmux.sh), so both names occur there.
reference_robots:
  jr: [JR02]
  rr: [RR08, JR02]

# Reference files that come from private repos (GitLab mit-acl, github blakete/dlio_ws).
# This repo is public, so they are not copied here: each one is named by repo, commit and
# path, and parity_check reads it from a pinned checkout (build_images.sh's under .cache/,
# else its own clone under .cache/reference/, with the key the image builds use). It is
# refused unless its parsed content hashes to yaml_sha256, the hash of the robot's copy
# (parity_check.py yaml_digest); for these files the two are identical.
external:
  config/mpc/mpc.yaml:  # hw-mighty share/mpc/config/mpc.yaml on JR02
    url: git@gitlab.com:mit-acl/ugv/ugv_control/mpc.git
    sha: 193c36bf7d78e7e10e493f9db38c31c6d84122b4
    path: config/mpc.yaml
    yaml_sha256: 8af27419e86ca628e3ebc6eae24c840e01e1489a991a4cbdc84619788ac1415f
  config/mapping/global_mapper_junior_dlio.yaml:  # mapping:/mapping_config/ on JR02
    url: git@gitlab.com:mit-acl/ugv/redrover/mapping_ws.git
    sha: c1233f78eae7dab33ab881efab7bd7d59b679fdf
    path: config/mapping/global_mapper_junior_dlio.yaml
    yaml_sha256: 0c484842d8bf812e8aa8cd87f14ac343ce2abd9f1e4b98cdba724c568350b036
  config/mapping/map_fusion_junior.yaml:  # mapping:/mapping_config/ on JR02
    url: git@gitlab.com:mit-acl/ugv/redrover/mapping_ws.git
    sha: c1233f78eae7dab33ab881efab7bd7d59b679fdf
