    url: git@gitlab.com:mit-acl/ugv/redrover/rover.git
    sha: b39c8982ca84c5c426068b8ae20f1fdf93bb7b33
    path: rover_control/config/teleop_logitech.yaml
    yaml_sha256: 16ceeac7e774f5e60f71db138eceb2b5be996d2e5222c3032586497b549ac3e5

nodes:
  # hw-mighty container on JR02 (mighty 5094cdb binary, db3018a config)
  mighty_node:
    fqn: /JR02/mighty_node
    container: sim-mighty
    params: {kind: dump, files: [params/mighty_node.yaml]}
  goal_selector:
    fqn: /JR02/goal_selector
    container: sim-mighty
    params: {kind: dump, files: [params/goal_selector.yaml]}
  mpc:
    fqn: /JR02/mpc
    container: sim-mighty
    params: {kind: files, files: [config/mpc/mpc.yaml, launch_params/mpc.yaml]}
  convert_odom_to_state:
    fqn: /JR02/convert_odom_to_state
    container: sim-mighty
    note: started with remaps only (odom:=dlio/odom_node/odom), no params; graph only

  # mapping container (mapping_ws c1233f7 configs, acl-mapping f44e045, map_fusion 8ea4ca7)
  global_mapper_ros:
    fqn: /JR02/global_mapper_ros
    container: sim-mapping
    params:
      kind: files
      files: [config/mapping/global_mapper_junior_dlio.yaml, launch_params/global_mapper_ros.yaml]
      by_class:
        rr: {files: [class_rr/mapping/global_mapper_red_rover.yaml, launch_params/global_mapper_ros.yaml]}
  map_fusion_node:
    fqn: /JR02/map_fusion_node
    container: sim-mapping
    params:
      kind: files
      files: [config/mapping/map_fusion_junior.yaml, launch_params/map_fusion_node.yaml]
      by_class:
        rr: {files: [class_rr/mapping/map_fusion_red_rover.yaml, launch_params/map_fusion_node.yaml]}
  persistent_map_node:
    fqn: /JR02/persistent_map_node
    container: sim-mapping
    params: {kind: files, files: [config/mapping/persistent_map.yaml, launch_params/persistent_map_node.yaml]}

  # on JR02's Orin, sim-elevation in the sim
  elevation_mapping_node:
    fqn: /JR02/elevation_mapping_node
    container: sim-elevation
    note: runs on the Orin, whose launch params were not captured for this reference; graph only

  # dlio container (DLIO 73c2489, dlio_ws cfg_overlay/JR02 baked in, scripts 59f6ee2)
  dlio_odom_node:
    fqn: /JR02/dlio_odom_node
    container: sim-dlio-{class}
    params:
      kind: files
      files: [config/dlio/dlio.yaml, config/dlio/params.yaml,
              launch_params/dlio_odom_node.initial_pose_topic.yaml, launch_params/dlio_odom_node.two_d_only.yaml]
      by_class:
        rr:
          files: [class_rr/dlio/dlio.yaml, class_rr/dlio/params.yaml,
                  launch_params/dlio_odom_node.initial_pose_topic.yaml, launch_params/dlio_odom_node.two_d_only.yaml]
  dlio_map_node:
    fqn: /dlio_map_node
    container: sim-dlio-{class}
    params:
      kind: files
      files: [config/dlio/dlio.yaml, config/dlio/params.yaml]
      by_class:
        rr: {files: [class_rr/dlio/dlio.yaml, class_rr/dlio/params.yaml]}
  dlio_session:
    fqn: /JR02/dlio_session
    container: sim-dlio-{class}
    note: dlio_ws scripts/dlio_session.py, no params; graph only
  map_odom_tf_broadcaster:
    fqn: /map_odom_tf_broadcaster
    container: sim-dlio-{class}
    note: dlio_ws scripts/map_odom_tf.py, no params; graph only

  # drive container (rover b39c898 = tree 0dc816f; acl_ctrl_safety 5cb2be0)
  safety_node:
    fqn: /JR02/safety_node
    container: sim-drive
    params:
      kind: files
      files: [launch_params/safety_node.yaml]
      by_class:
        rr: {ref_fqn: /RR08/safety_node}  # the file has no RR08 block: the /** values apply
  robot_state_publisher:
    fqn: /JR02/robot_state_publisher
    container: sim-drive
    params: {kind: files, files: [launch_params/robot_state_publisher.yaml], urdf_key: robot_description}
