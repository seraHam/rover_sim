  class_rr/mapping/global_mapper_red_rover.yaml:  # RR class: the pinned file (no RR robot was captured)
    url: git@gitlab.com:mit-acl/ugv/redrover/mapping_ws.git
    sha: c1233f78eae7dab33ab881efab7bd7d59b679fdf
    path: config/mapping/global_mapper_red_rover.yaml
    yaml_sha256: 6b09ff91f227c0ce4a16d4b06f0cf8598c267615fc031f46e9281267a1b76ed6
  class_rr/mapping/map_fusion_red_rover.yaml:  # RR class: the pinned file (no RR robot was captured)
    url: git@gitlab.com:mit-acl/ugv/redrover/mapping_ws.git
    sha: c1233f78eae7dab33ab881efab7bd7d59b679fdf
    path: config/mapping/map_fusion_red_rover.yaml
    yaml_sha256: 0008b3d92a3232828727c142793694aafb700e1d6182bf5a8c40443d03595ca6
  config/dlio/dlio.yaml:  # dlio: share/direct_lidar_inertial_odometry/cfg/ on JR02
    url: git@github.com:blakete/dlio_ws.git
    sha: e67633154e7f41ed957cd3f29ba144d89ca85925
    path: cfg_overlay/JR02/dlio.yaml
    yaml_sha256: 6188aea6665577da7a572462caa5325cfa2aa44b682e195d0f912f5a3a0ef864
  config/dlio/params.yaml:  # dlio: share/direct_lidar_inertial_odometry/cfg/ on JR02
    url: git@github.com:blakete/dlio_ws.git
    sha: e67633154e7f41ed957cd3f29ba144d89ca85925
