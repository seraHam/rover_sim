    yaml_sha256: a07ec501fc6e33814eea73dba1cce3b4e52c1c80887bc142a2dda03ebd6c2ca1
  class_rr/dlio/params.yaml:  # RR class: the pinned RR08 overlay (no RR robot was captured)
    url: git@github.com:blakete/dlio_ws.git
