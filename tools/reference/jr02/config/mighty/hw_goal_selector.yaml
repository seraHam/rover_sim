# =============================================================================
# Goal selector -- Ground Robot Hardware
# =============================================================================
# Parameters of the goal_selector node (exploration + manual/return-home goals). Launched by
# launch/onboard_mighty.launch.py only_nodes:=goal_selector, which layers this file
# ON TOP of the planner's merged mighty.yaml <- hw_mighty_ground_robot.yaml block
# (the selector reads horizon, map window, inflation_2d_m, ... from that layer).
# Anything set here wins over the planner layer. Single source for these keys: they
# are no longer in hw_mighty_ground_robot.yaml. goal_radius is intentionally also kept
# in the planner YAML (the planner uses it); keep the two in step.
# exploration.detector.min_obstacle_distance_m is gone (D3): not used by the selector.
# map_max_age_sec (stale-map pause) is also read from the planner layer: one key for both nodes.
goal_selector:
    ros__parameters:

        # --- Goal reached (return-home re-arm) ---
        goal_radius: 0.5                                # [m] Goal reached threshold

        # --- Manual goal ---
        manual_goal.start_timeout_sec: 15.0             # [s] release a manual goal if the robot has not moved more than exploration.manager.stuck_move_thresh_m within this long of the commit (e.g. goal on an obstacle, planner FAILED forever). Exploration resumes if enabled. 0 disables this start check; afterwards the normal stuck_timeout_sec applies

        # --- Frontier-Based Exploration ---
        exploration.return_home.enabled: false          # [-] true: when no frontier is left, drive back to the start pose (latched until arrival). false: go idle where the robot is; exploration resumes when a new frontier appears. The /exploration/return_home topic still works either way. Off for the 2026-10 hardware tests (return-home behaviour to be revisited, spec §13)
        # Hardware default: ON. The rover drives itself to frontiers (persistent map, see below) as
        # soon as the drive is in AUTO (and, with the geofence engaged, the fence is locked).
        # false: no autonomous goals; manual goals (term_goal_rviz) still work. See plan: snazzy-moseying-donut.md
        exploration.enabled: true
        exploration.select_rate_hz: 1.0
        exploration.default_goal_z: 0.0
        exploration.detector.cluster_min_cells: 6
        exploration.detector.border_margin_cells: 1
        exploration.detector.obstacle_clearance_cells: 0   # occupied band (inflation_2d_m) already keeps frontiers clear of obstacles
        exploration.detector.robot_snap_radius_m: 0.5
        exploration.detector.max_cluster_extent_m: 3.0    # [m] a frontier cluster longer than this is split into world-anchored 3 m tiles, one frontier (and goal) per piece, so goals stay on the frontier instead of at the centroid of a long/curved cluster. 0 = no split
        # --- Persistent-map frontier detection ---
        # true: detect frontiers on the mapper's growing accumulated grid (persistent_map_topic_name)
        # instead of the selector's own VisitedMap / the sliding occ_2d window. The VisitedMap is then
        # not fused, absorbed or published. The live occ_2d_topic_name grid is still needed (selection
        # waits for it). Detection runs when a persistent grid arrives (~0.5 Hz on RR04), not per occ_2d.
        exploration.persistent_map.enabled: true
        persistent_map_topic_name: "persistent_map/grid" # [-] relative to the robot namespace; reliable + transient_local
        exploration.persistent_map.detect_whole_map: true # [-] true: detect over the whole grid (cost grows with the map). false: only the square window below
        exploration.persistent_map.detect_radius_m: 30.0   # [m] half-side of the window around the robot (used when detect_whole_map is false; must be > 0)
        exploration.bounds.enabled: false
        # exploration.bounds.min_x: 3.0
        # exploration.bounds.max_x:  18.0
        # exploration.bounds.min_y:  -5.0
        # exploration.bounds.max_y:  5.0
        exploration.bounds.min_x: -6.0
        exploration.bounds.max_x:  18.0
        exploration.bounds.min_y: -17.5
        exploration.bounds.max_y:  0.0
        exploration.utility.w_size: 1.0
        exploration.utility.w_dist: 60.0
        exploration.utility.w_info: 1.0
        exploration.utility.w_revisit: 0.5
        exploration.utility.w_heading: 0.3
        exploration.utility.size_ref_m2: 5.0
        # Distance normaliser: dist_norm = clamp01(dist / dist_ref_m), so this is a
        # SATURATION point, not a scale -- every frontier at or beyond it is penalised
        # identically and distance stops discriminating between them, leaving the much
        # weaker size/info/heading terms to pick the winner (which can choose the farther
        # one). Raised 25.0 -> 60.0 on 2026-08-13 to match the occ_2d/elevation map window
        # (core_param.yaml map_length: 60.0) so distance stays meaningful across the whole
        # local map. Side effect: the penalty gradient softens from w_dist/dist_ref_m =
        # 2.4/m to 1.0/m, so the other terms (max ~2.3 total) can now outweigh ~2.3m of
        # extra travel instead of ~1m -- i.e. they tiebreak among nearby frontiers rather
        # than being irrelevant. Raise further if a mission ever spans more than 60m.
        exploration.utility.dist_ref_m: 60.0
        exploration.utility.sensor_radius_m: 5.0
        exploration.utility.goal_select_threshold: -1.0e9
        exploration.manager.merge_radius_m: 0.75
        exploration.manager.centroid_ema_alpha: 0.5
        exploration.manager.visit_radius_m: 0.3
        exploration.manager.visit_dwell_sec: 3.0
        exploration.manager.verify_radius_cells: 2
        exploration.manager.max_frontiers: 1000
        exploration.manager.unreachable_consec_thresh: 5
        exploration.manager.stuck_timeout_sec: 5.0               # [s]   after moving then no progress for this long (e.g. parked at last A* waypoint), INVALIDATE frontier and re-select; a stuck MANUAL goal is released (exploration resumes if enabled). 0 disables (both)
        exploration.manager.stuck_move_thresh_m: 0.10            # [m]   displacement below this counts as "no progress" for the stuck timeout
        # Pursuit timeout: auto-INVALIDATE a frontier we've been chasing longer
        # than max(min_sec, dist/v_ref*factor). Set factor <= 0 to disable.
        exploration.manager.pursuit_timeout_factor: 3.0
        exploration.manager.pursuit_timeout_v_ref: 0.5
        exploration.manager.pursuit_timeout_min_sec: 10.0
        exploration.manager.invalidation_keep_out_radius_m: 0.75
        exploration.manager.invalidation_cooldown_sec: 60.0
        # Geofence goal filter: the geofence publishes its fence rings (in <R>/odom) + offset_m
        # (footprint radius + margin + its goal_fence.standoff_m) on geofence/goal_fence at 2 Hz.
        # While the fence is ENFORCING, a frontier is invalidated before ranking unless it is inside
        # keep_in, outside every keep_out and >= offset_m + margin_m from every fence edge (= the
        # gate's core, whole fence, exact). While enforcing but not ready (localizing / no anchor)
        # no new goals are committed. Shadow / goal_fence off (message not active) -> no filtering.
        # No goal_fence fresher than max_age_sec: the drive gate's echo (gate_topic_name, 2 Hz from
        # the drive) decides. Gate engaged -> pause (geofence restarting; the gate holds the robot
        # anyway). Gate not engaged (geofence off / shadow) or no echo -> no filtering. Before the
        # first goal_fence after start, goals pause for up to startup_wait_sec (unless the gate says
        # not engaged); then no filtering (geofence off, or an older image without goal_fence).
        exploration.geofence.enabled: true
        exploration.geofence.topic_name: "geofence/goal_fence"  # [-] relative to the robot namespace
        exploration.geofence.margin_m: 0.0              # [m] extra beyond the fence's offset_m (which has the footprint)
        exploration.geofence.max_age_sec: 2.0           # [s] older goal_fence -> the gate echo decides
        exploration.geofence.gate_topic_name: "safety_node/geofence_gate"  # [-] drive gate echo, relative to the robot namespace
        exploration.geofence.gate_max_age_sec: 2.0      # [s] older gate echo is ignored
        exploration.geofence.startup_wait_sec: 10.0     # [s] max pause for the first goal_fence after start
        # Goal preemption: while pursuing a frontier, keep re-ranking every
        # select tick (select_rate_hz) and SWITCH goals when another frontier
        # beats the current one's freshly recomputed utility by more than
        # preempt_margin. Fixes the "commits to a far frontier just before a
        # closer one gets detected" hard-commit behavior. With w_dist 60 /
        # dist_ref_m 60 the utility slope is 1.0 per meter, so margin 2.0 ~=
        # "switch only for >2 m of advantage". min_commit_sec is a dwell after
        # each (re)commit so back-to-back switches can't thrash the planner.
        # Preempted frontiers are NOT invalidated — they stay ACTIVE and their
        # pursuit timeout is disarmed, so they remain fair candidates later.
        exploration.manager.preempt_enabled: true
        exploration.manager.preempt_margin: 2.0
        exploration.manager.preempt_min_commit_sec: 2.0
        exploration.visited_map.center_x: 0.0
        exploration.visited_map.center_y: 0.0
        exploration.visited_map.width_m: 100.0
        exploration.visited_map.height_m: 100.0
        exploration.visited_map.resolution_m: 0.10
        exploration.visited_map.publish: true
        exploration.visited_map.fuse_into_local: true  # disabled to stop stale observations re-seeding phantom FREE inside closed rooms
        exploration.visited_map.detect_on_visited_map: true  # MUST be true (false unsupported since the New Plan, spec §13); run frontier WFD on the persistent map so revisited corridors still surface their far-end frontier
        # MinPos multi-robot frontier allocation: rank-based peer-aware assignment so
        # several rovers de-duplicate their frontiers.
        #
        # DISABLED 2026-08-13. The previous comment here claimed this "no-ops to
        # nearest-frontier when no peers are heard" -- it does not no-op, it swaps the
        # SELECTOR. selectNextGoalMinPos() sorts candidates by (rank, distance, utility);
        # solo, rank is 0 for everything, so the pick collapses to raw straight-line
        # distance and utility is only consulted on an exact float tie (i.e. never).
        # That silently bypasses the entire exploration.utility.* block above -- w_dist,
        # w_heading, w_size, w_info and w_revisit all stop having any effect, which is
        # not obvious from the parameter name or the old comment.
        #
        # With this false, selectNextGoal() picks argmax(utility) and those weights are
        # live. Set it back to true before running multi-rover HW, and expect the utility
        # weights to stop applying again when you do.
        exploration.minpos.enabled: false                  # [-] enable rank-based peer-aware allocation
        exploration.minpos.peer_timeout_sec: 5.0            # [s] drop peer after this silence
        exploration.minpos.peer_publish_rate_hz: 5.0        # [Hz] pose broadcast throttle
        exploration.minpos.min_frontier_dist_to_peers_m: 3.0 # [m] reject frontier candidates within this radius of any active peer (0 disables)
        exploration.minpos.peer_visit_radius_m: 2.0          # [m] sticky: mark frontier VISITED when any active peer is within this radius (robust to frame drift; 0 disables)
        exploration.visualization.publish_markers: true
